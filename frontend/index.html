<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dental Vision Provider Comparison — POC</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; }
  form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  select, input[type="file"], button { padding: 8px; font-size: 1rem; }
  button { cursor: pointer; background: #222; color: #fff; border: none; border-radius: 4px; padding: 10px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 0.9rem; color: #555; }
  #usage { display: flex; gap: 20px; margin: 16px 0; font-size: 0.9rem; }
  #usage div { background: #f2f2f2; padding: 8px 12px; border-radius: 4px; }
  pre { background: #f8f8f8; padding: 16px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #ddd; border-radius: 4px; }
  .error { color: #b00020; }
</style>
</head>
<body>

<h1>Dental Vision Provider Comparison — POC</h1>
<p>Upload a front smile photo (required), plus left/right profile photos (optional), pick a provider, run the same analysis prompt against all provided images together.</p>

<form id="analyze-form">
  <label for="front-image">Front smile photo (required)</label>
  <input type="file" id="front-image" name="front_image" accept="image/*" required />

  <label for="left-image">Left profile photo (optional)</label>
  <input type="file" id="left-image" name="left_image" accept="image/*" />

  <label for="right-image">Right profile photo (optional)</label>
  <input type="file" id="right-image" name="right_image" accept="image/*" />

  <label for="provider">Provider / Model</label>
  <select id="provider" name="provider">
    <!-- <option value="openai:gpt-5.6-sol">OpenAI — gpt-5.6-sol</option> -->
    <option value="openai:gpt-4.1-nano">OpenAI — gpt-4.1-nano</option>
    <option value="gemini:gemini-3.5-flash-lite">Gemini — gemini-3.5-flash-lite</option>
    <option value="gemini:gemini-3.5-flash">Gemini — gemini-3.5-flash</option>
    <option value="gemini:gemini-3-pro">Gemini — gemini-3-pro</option>
    <option value="gemini:gemini-3.1-pro-preview">Gemini — gemini-3.1-pro-preview</option>
    <option value="gemini:gemini-2.5-pro">Gemini — gemini-2.5-pro</option>
    <option value="groq:qwen/qwen3.6-27b">Groq — qwen/qwen3.6-27b</option>
    <option value="claude:claude-sonnet-5">Claude — claude-sonnet-5</option>
    <option value="claude:claude-opus-4-8">Claude — claude-opus-4-8</option>
  </select>

  <button type="submit" id="submit-btn">Run Analysis</button>
</form>

<div id="status"></div>
<div id="usage" style="display: none;">
  <div>Input tokens: <strong id="in-tokens">-</strong></div>
  <div>Output tokens: <strong id="out-tokens">-</strong></div>
  <div>Total tokens: <strong id="total-tokens">-</strong></div>
  <div>Latency: <strong id="latency">-</strong>s</div>
</div>

<h2 id="report-heading" style="display: none; font-size: 1.1rem; margin-top: 24px;">Report</h2>
<pre id="report" style="display: none;"></pre>

<script>
const form = document.getElementById("analyze-form");
const statusEl = document.getElementById("status");
const reportEl = document.getElementById("report");
const usageEl = document.getElementById("usage");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const frontFile = document.getElementById("front-image").files[0];
  const leftFile = document.getElementById("left-image").files[0];
  const rightFile = document.getElementById("right-image").files[0];
  const [provider, model] = document.getElementById("provider").value.split(":");

  if (!frontFile) {
    statusEl.textContent = "Please choose a front smile photo first.";
    return;
  }

  const formData = new FormData();
  formData.append("front_image", frontFile);
  if (leftFile) formData.append("left_image", leftFile);
  if (rightFile) formData.append("right_image", rightFile);
  formData.append("provider", provider);
  formData.append("model", model);

  submitBtn.disabled = true;
  statusEl.textContent = "Running analysis... this can take a few seconds.";
  statusEl.classList.remove("error");
  reportEl.style.display = "none";
  document.getElementById("report-heading").style.display = "none";
  usageEl.style.display = "none";

  try {
    const res = await fetch("/analyze", { method: "POST", body: formData });
    const data = await res.json();

    if (!res.ok) {
      statusEl.textContent = "Error: " + (data.detail || "Request failed.");
      statusEl.classList.add("error");
      submitBtn.disabled = false;
      return;
    }

    statusEl.textContent = `Done. Provider: ${data.provider} (${data.model}) — ${data.images_used} image(s) analyzed`;

    document.getElementById("in-tokens").textContent = data.usage.input_tokens ?? "n/a";
    document.getElementById("out-tokens").textContent = data.usage.output_tokens ?? "n/a";
    document.getElementById("total-tokens").textContent = data.usage.total_tokens ?? "n/a";
    document.getElementById("latency").textContent = data.usage.latency_seconds ?? "n/a";
    usageEl.style.display = "flex";

    reportEl.textContent = data.report_text;
    reportEl.style.display = "block";
    document.getElementById("report-heading").style.display = "block";
  } catch (err) {
    statusEl.textContent = "Request failed: " + err.message;
    statusEl.classList.add("error");
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
